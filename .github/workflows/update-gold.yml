name: Update gold ring scan

# Runs the scanner on a schedule, writes data/results.json, and commits it so
# the GitHub Pages dashboard (index.html) always shows the latest auctions.
#
# Requires two repository secrets (Settings > Secrets and variables > Actions):
#   EBAY_CLIENT_ID      your eBay App ID (Client ID)
#   EBAY_CLIENT_SECRET  your eBay Cert ID (Client Secret)
# The gold price uses the keyless "free" provider, so no price-API secret needed.
#
# NOTE: scheduled runs only fire from the repository's DEFAULT branch (main).
# You can always trigger a run by hand from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "0 7 * * *"      # daily at 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run scanner
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          python gold_ring_scanner.py \
            --query "9ct gold signet ring" \
            --max-price 250 \
            --limit 200

      - name: Commit updated scan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto-update gold ring scan data"
            git push
          fi
