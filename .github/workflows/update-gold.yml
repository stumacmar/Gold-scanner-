name: Update gold ring scan

# Runs the scanner on a schedule, writes data/results.json, and commits it so
# the GitHub Pages dashboard (index.html) always shows the latest auctions.
#
# Requires two repository secrets (Settings > Secrets and variables > Actions):
#   EBAY_CLIENT_ID      your eBay App ID (Client ID)
#   EBAY_CLIENT_SECRET  your eBay Cert ID (Client Secret)
# The gold price uses the keyless "free" provider, so no price-API secret needed.
#
# NOTE: scheduled runs only fire from the repository's DEFAULT branch (main).
# You can always trigger a run by hand from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "0 8 * * *"      # daily at 08:00 UTC (09:00 BST) — after eBay's
                             # daily quota reset (~07:00 UTC / midnight US Pacific)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run scans (one per carat) and build index
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          MARKETS="EBAY_GB,EBAY_US,EBAY_IE,EBAY_AU,EBAY_CA,EBAY_DE,EBAY_FR,EBAY_IT,EBAY_ES,EBAY_NL,EBAY_AT,EBAY_CH,EBAY_BE,EBAY_PL,EBAY_HK,EBAY_SG"
          # Heavy solid-gold rings only. The scanner now auto-builds a localised
          # + English query matrix per market (signet/band/intaglio/vintage/gents
          # × each marketplace's language and fineness mark), so no --query is
          # passed here. A per-carat min-price floor (a weight proxy) skips tiny
          # rings at the source. --conditions ANY keeps used/new AND for-parts
          # (scrap) listings. Weight floors: CONFIRMED >=15g (strict), ESTIMATED
          # kept if the conservative low-bound >=12g, UNKNOWN routed to the
          # review lane (kept, never dropped). Only CONFIRMED weights can flag
          # "value" -- a buy signal never rests on a guessed weight.
          COMMON="--max-price 6000 --limit 250 --min-weight 15 --conditions ANY --markets $MARKETS"
          python gold_ring_scanner.py --default-carat 9  $COMMON --min-price 350  --json data/9ct.json  --csv data/9ct.csv
          sleep 20
          python gold_ring_scanner.py --default-carat 14 $COMMON --min-price 550  --json data/14ct.json --csv data/14ct.csv
          sleep 20
          python gold_ring_scanner.py --default-carat 18 $COMMON --min-price 700  --json data/18ct.json --csv data/18ct.csv
          sleep 20
          python gold_ring_scanner.py --default-carat 22 $COMMON --min-price 850  --json data/22ct.json --csv data/22ct.csv
          sleep 20
          # Silver screen: heavy sterling signets/intaglios. Lower price band
          # (silver melt is small; heavy sterling signets sell ~£30-300).
          python gold_ring_scanner.py --metal silver --max-price 600 --min-price 15 \
            --limit 250 --conditions ANY --markets $MARKETS \
            --json data/silver.json --csv data/silver.csv
          python scripts/build_index.py

      - name: Commit updated scan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Auto-update gold ring scan data"
          # The branch may have advanced since checkout (other pushes), so
          # rebase onto the latest before pushing, and retry on races.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed."
              exit 0
            fi
            echo "Push race; retrying ($i)..."
            sleep 5
          done
          echo "Failed to push after retries" >&2
          exit 1
