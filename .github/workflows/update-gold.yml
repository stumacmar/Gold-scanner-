name: Update gold ring scan

# Runs the scanner on a schedule, writes data/results.json, and commits it so
# the GitHub Pages dashboard (index.html) always shows the latest auctions.
#
# Requires two repository secrets (Settings > Secrets and variables > Actions):
#   EBAY_CLIENT_ID      your eBay App ID (Client ID)
#   EBAY_CLIENT_SECRET  your eBay Cert ID (Client Secret)
# The gold price uses the keyless "free" provider, so no price-API secret needed.
#
# NOTE: scheduled runs only fire from the repository's DEFAULT branch (main).
# You can always trigger a run by hand from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "0 7 * * *"      # daily at 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run scans (one per carat) and build index
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          MARKETS="EBAY_GB,EBAY_US,EBAY_DE,EBAY_FR,EBAY_IT,EBAY_ES,EBAY_IE"
          python gold_ring_scanner.py --default-carat 9  --max-price 5000 --limit 150 --markets "$MARKETS" --json data/9ct.json  --csv data/9ct.csv  \
            --query "9ct gold signet ring || 9ct gold ring || vintage 9ct gold ring"
          sleep 20
          python gold_ring_scanner.py --default-carat 14 --max-price 5000 --limit 150 --markets "$MARKETS" --json data/14ct.json --csv data/14ct.csv \
            --query "14ct gold signet ring || 14ct gold ring || vintage 14ct gold ring"
          sleep 20
          python gold_ring_scanner.py --default-carat 18 --max-price 5000 --limit 150 --markets "$MARKETS" --json data/18ct.json --csv data/18ct.csv \
            --query "18ct gold signet ring || 18ct gold ring || vintage 18ct gold ring"
          sleep 20
          python gold_ring_scanner.py --default-carat 22 --max-price 5000 --limit 150 --markets "$MARKETS" --json data/22ct.json --csv data/22ct.csv \
            --query "22ct gold signet ring || 22ct gold ring || vintage 22ct gold ring"
          python scripts/build_index.py

      - name: Commit updated scan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Auto-update gold ring scan data"
          # The branch may have advanced since checkout (other pushes), so
          # rebase onto the latest before pushing, and retry on races.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed."
              exit 0
            fi
            echo "Push race; retrying ($i)..."
            sleep 5
          done
          echo "Failed to push after retries" >&2
          exit 1
