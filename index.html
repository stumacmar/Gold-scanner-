<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b0e14" />
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
<title>Signet Scanner</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #0b0e14; color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  header { padding: 16px 16px 6px; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; }
  h1 .coin { color: #d4af37; }
  .sub { margin: 4px 0 0; font-size: 12px; color: #8a93a6; line-height: 1.5; }

  /* One row of controls: carat chips + value toggle + sort */
  .controls { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px;
    align-items: center; scrollbar-width: none; }
  .controls::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px;
    border: 1px solid #232a3a; background: #131826; color: #cfd6e4; font-size: 13px;
    font-weight: 600; cursor: pointer; white-space: nowrap; }
  .chip.active { background: #d4af37; border-color: #d4af37; color: #1a1400; }
  .chip.val.active { background: #26a65b; border-color: #26a65b; color: #04160b; }
  select.sort { flex: 0 0 auto; padding: 8px 12px; border-radius: 999px;
    border: 1px solid #232a3a; background: #131826; color: #e6e6e6; font-size: 13px;
    font-weight: 600; }

  .list { padding: 10px 12px 28px; display: flex; flex-direction: column; gap: 10px; }
  .card { display: block; background: #131826; border: 1px solid #232a3a;
    border-radius: 14px; padding: 13px 14px; }
  .card.value { border-color: #d4af37; box-shadow: 0 0 0 1px rgba(212,175,55,0.25); }
  .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .title { font-size: 14px; font-weight: 600; line-height: 1.35; color: #eef1f7; }
  .tag { flex: 0 0 auto; font-size: 10px; font-weight: 700; padding: 3px 7px;
    border-radius: 6px; letter-spacing: .3px; text-transform: uppercase;
    background: #d4af37; color: #1a1400; }
  .row2 { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; }
  .kv { color: #8a93a6; } .kv b { color: #e6e6e6; font-weight: 600; }
  .muted { color: #6b7488; }
  .ratio { font-weight: 700; }
  .r-good { color: #26a65b; } .r-mid { color: #e0a93b; } .r-low { color: #8a93a6; }
  .foot { display: flex; justify-content: space-between; margin-top: 9px;
    font-size: 11.5px; color: #6b7488; }
  .foot .left { color: #cfd6e4; font-weight: 600; }
  .warn { margin: 8px 16px 0; padding: 10px 13px; background: #1a1407;
    border: 1px solid #3a2e10; border-radius: 12px; font-size: 11px; color: #cbb98a;
    line-height: 1.5; }
  .err, .empty { padding: 24px 16px; font-size: 14px; }
  .err { color: #ef5350; } .empty { color: #8a93a6; }
</style>
</head>
<body>
  <header>
    <h1><span class="coin">●</span> Signet Scanner</h1>
    <p class="sub" id="sub">Heavy solid-gold signets &amp; intaglios · 15g+ · loading…</p>
  </header>

  <div class="controls" id="controls"></div>
  <div class="list" id="list"></div>

  <div class="warn">
    ⚠ Verify the live price on eBay before bidding (the API can lag). Weights are
    seller-claimed — confirm against the hallmark/photos. <b>Non-UK listings</b>
    show a landed cost with import VAT + postage estimated in.
  </div>

<script>
const fmtGBP = n => (n == null ? "?" : "£" + Number(n).toLocaleString("en-GB", {maximumFractionDigits: 0}));
let ALL = [];            // merged records across every carat file
let META = null;         // meta of the newest file (spot price, timestamp)
let caratFilter = 0;     // 0 = all | 9 | 14 | 18 | 22
let valueOnly = false;
let sortBy = "best";

function tlMinutes(s) {
  if (!s || s === "n/a" || s === "ended") return Infinity;
  let m = 0, d = s.match(/(\d+)d/), h = s.match(/(\d+)h/), mi = s.match(/(\d+)m/);
  if (d) m += +d[1] * 1440;
  if (h) m += +h[1] * 60;
  if (mi) m += +mi[1];
  return m || Infinity;
}
const SORTS = {
  best:   (a, b) => (b.ratio ?? -1) - (a.ratio ?? -1),
  heavy:  (a, b) => (b.weight_g ?? -1) - (a.weight_g ?? -1),
  cheap:  (a, b) => (a.landed_cost ?? 1e12) - (b.landed_cost ?? 1e12),
  ending: (a, b) => tlMinutes(a.time_left) - tlMinutes(b.time_left),
};
const shown = () => ALL
  .filter(r => (!caratFilter || r.carat === caratFilter) && (!valueOnly || r.is_value))
  .sort(SORTS[sortBy]);

function escapeHtml(s) {
  return (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
const ratioClass = r => r == null ? "r-low" : r >= 1 ? "r-good" : r >= 0.85 ? "r-mid" : "r-low";

function card(rec) {
  const cls = "card" + (rec.is_value ? " value" : "");
  const tag = rec.is_value ? '<span class="tag">Value</span>' : "";
  const ratio = rec.ratio == null ? "—"
    : '<span class="ratio ' + ratioClass(rec.ratio) + '">' + rec.ratio.toFixed(2) + '×</span>';
  const bids = (rec.bids === "" || rec.bids == null) ? 0 : rec.bids;
  const intag = (rec.tags || []).includes("intaglio") ? ' <span class="muted">· intaglio</span>' : "";
  return `
    <a class="${cls}" href="${rec.url}" target="_blank" rel="noopener">
      <div class="top"><div class="title">${rec.flag || ""} ${escapeHtml(rec.title)}</div>${tag}</div>
      <div class="row2">
        <span class="kv">Carat <b>${rec.carat}ct</b>${intag}</span>
        <span class="kv">Weight <b>${rec.weight_g?.toFixed(1) ?? "?"}g</b></span>
        <span class="kv">Price <b>${fmtGBP(rec.current_bid)}</b>${rec.price_orig ? ` <span class="muted">(${rec.price_orig})</span>` : ""}</span>
        ${rec.country !== "UK" && rec.landed_cost ? `<span class="kv">Landed <b>~${fmtGBP(rec.landed_cost)}</b></span>` : ""}
        <span class="kv">Melt <b>${fmtGBP(rec.melt_value)}</b></span>
        <span class="kv">Melt/Cost ${ratio}</span>
        ${rec.stones ? '<span class="muted">💎</span>' : ""}
      </div>
      <div class="foot">
        <span class="left">${rec.buying === "Buy now" ? "🏷 Buy now"
          : "⏳ " + rec.time_left + " · " + bids + " bid" + (bids == 1 ? "" : "s")}</span>
        <span>tap to open ↗</span>
      </div>
    </a>`;
}

function render() {
  const rows = shown();
  const carats = [...new Set(ALL.map(r => r.carat))].sort((a, b) => a - b);
  const chip = (on, v, label, extra) =>
    `<div class="chip ${extra || ""} ${on ? "active" : ""}" data-v="${v}">${label}</div>`;
  document.getElementById("controls").innerHTML =
    chip(!caratFilter, 0, `All ${ALL.length}`) +
    carats.map(c => chip(caratFilter === c, c,
      `${c}ct ${ALL.filter(r => r.carat === c).length}`)).join("") +
    chip(valueOnly, "value", `★ Value ${ALL.filter(r => r.is_value).length}`, "val") +
    `<select class="sort" id="sort">
       <option value="best" ${sortBy === "best" ? "selected" : ""}>Best value</option>
       <option value="heavy" ${sortBy === "heavy" ? "selected" : ""}>Heaviest</option>
       <option value="cheap" ${sortBy === "cheap" ? "selected" : ""}>Cheapest</option>
       <option value="ending" ${sortBy === "ending" ? "selected" : ""}>Ending soonest</option>
     </select>`;

  if (META) {
    const when = new Date(META.generated_at);
    document.getElementById("sub").innerHTML =
      `Heavy solid-gold signets &amp; intaglios · <b>15g+</b> · gold ${fmtGBP(META.spot_gbp_per_oz)}/oz` +
      `<br>${rows.length} shown of ${ALL.length} · updated ${when.toLocaleDateString("en-GB")} ` +
      when.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"});
  }
  document.getElementById("list").innerHTML = rows.length ? rows.map(card).join("")
    : '<div class="empty">Nothing matches — tap All to clear filters, or check back after the morning scan.</div>';

  document.getElementById("controls").onclick = (e) => {
    const c = e.target.closest(".chip");
    if (!c) return;
    if (c.dataset.v === "value") valueOnly = !valueOnly;
    else caratFilter = Number(c.dataset.v);
    render();
  };
  document.getElementById("sort").onchange = (e) => { sortBy = e.target.value; render(); };
}

// Load every carat file listed in the index, merge, and de-duplicate by URL
// (the same ring can surface in two carat scans).
fetch("./data/index.json?ts=" + Date.now())
  .then(r => { if (!r.ok) throw new Error("no index"); return r.json(); })
  .then(idx => Promise.all(idx.searches.map(s =>
    fetch("./data/" + s.file + "?ts=" + Date.now()).then(r => r.ok ? r.json() : null))))
  .then(files => {
    const seen = new Set();
    let newest = null;
    for (const f of files.filter(Boolean)) {
      if (!newest || f.meta.generated_at > newest.generated_at) newest = f.meta;
      for (const r of f.results) {
        if (r.url && seen.has(r.url)) continue;
        if (r.url) seen.add(r.url);
        ALL.push(r);
      }
    }
    META = newest;
    if (!ALL.length) {
      document.getElementById("list").innerHTML =
        '<div class="empty">No rings in the current scan — check back after the morning run.</div>';
      return;
    }
    render();
  })
  .catch(() => {
    document.getElementById("list").innerHTML =
      '<div class="err">No scan data yet. Once the GitHub Action runs, results appear here.</div>';
  });
</script>
</body>
</html>
